name: Generate result-view artifacts

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Create canonical Python environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: urban-pluvial-flood-phase0
          cache-environment: true
          init-shell: bash

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate lockfile and API artifacts
        working-directory: web
        run: |
          npm install --ignore-scripts
          npm run api:generate

      - name: Commit generated files when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json web/openapi.json web/src/api/generated.ts
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate result-view API and lock artifacts"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: result-view-generated
          if-no-files-found: error
          path: |
            web/package-lock.json
            web/openapi.json
            web/src/api/generated.ts
